%YAML:1.0 # need to specify the file type at the top!

cam:
  enabled: true
  max_n: 8
  use_stereo: true
  stereo_pair: [0, 1] # front (cam0, cam1), rear (cam2, cam3)
  do_calib_ext: true
  do_calib_int: false
  do_calib_dt: true
  n_pts: 500
  fast: 30
  grid_x: 15
  grid_y: 15
  min_px_dist: 30
  knn: 0.7
  downsample: true
  histogram_method: "CLAHE" # NONE, HISTOGRAM, CLAHE
  max_slam: 75
  max_msckf: 60
  feat_rep: "GLOBAL_FULL_INVERSE_DEPTH"
  init_cov_dt: 1e-4
  init_cov_ex_o: 1e-4
  init_cov_ex_p: 1e-4
  init_cov_in_k: 1e-1
  init_cov_in_c: 1e-1
  init_cov_in_r: 1e-5
  sigma_px: 1
  chi2_mult: 1

  fi_min_dist: 0.25
  fi_max_dist: 150
  fi_max_baseline: 2000
  fi_max_cond_number: 10000
  # ==================================================================
  # ==================================================================


# Isaac Sim front ZED X Wide (amiad_description run_sim.py --zed-resolution SVGA), received by
# zed_sim_cameras.launch.py. Rectified images: ideal pinhole from the simulated ZED calibration
# (/usr/local/zed/settings/SN*.conf, LEFT/RIGHT_CAM_SVGA), no distortion, 0.12 m baseline.
# T_cam_imu (IMU -> camera optical frame, p_cam = T_cam_imu * p_imu) from the URDF:
# imu = pulse80_imu_link, cam<0,1> = zed_front_<left,right>_camera_optical_frame,
# cam<2,3> = zed_rear_<left,right>_camera_optical_frame (looking backward).
cam0:
  timeoffset: 0.0
  T_cam_imu:
    - [0.0, 1.0, 0.0, 0.06]
    - [0.0, 0.0, 1.0, 0.06375]
    - [1.0, 0.0, 0.0, -0.50758]
    - [0.0, 0.0, 0.0, 1.0]
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [370.8, 370.8, 480.0, 300.0]
  resolution: [960, 600]
  topic: /zed_front/zed_node/left/color/rect/image

cam1:
  timeoffset: 0.0
  T_cam_imu:
    - [0.0, 1.0, 0.0, -0.06]
    - [0.0, 0.0, 1.0, 0.06375]
    - [1.0, 0.0, 0.0, -0.50758]
    - [0.0, 0.0, 0.0, 1.0]
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
