%YAML:1.0 # need to specify the file type at the top!

# Outdoor / direct sunlight tuning, 2 ZED X streams (front stereo pair), ZED HD1080 1920x1080.
# Main issues outdoors: high dynamic range (hard shadows vs. sunlit ground), sky and
# sun/lens-flare corners, moving vegetation and many far (low-parallax) features.

cam:
  enabled: true
  max_n: 1
  use_stereo: false
  stereo_pair: [0, 1] # front (0,1), rear (2,3), left (4,5), right (6,7)
  do_calib_ext: false
  do_calib_int: false
  do_calib_dt: false
  # --- tracking --------------------------------------------------------
  # CLAHE equalizes locally: keeps texture both in hard shadows and in sunlit areas.
  histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE
  n_pts: 400          # sky is masked, so spend the budget on the ground/scene below
  fast: 30            # higher threshold: reject weak corners from CLAHE noise, glare and leaves
  grid_x: 20
  grid_y: 20           # ~60x60 px cells on the 960x540 downsampled 1920x1080 images
  min_px_dist: 20
  knn: 0.7
  downsample: false    # 1920x1080 -> 960x540 (MINS halves the config intrinsics too)
  # --- update ----------------------------------------------------------
  max_slam: 60
  max_msckf: 40
  feat_rep: "GLOBAL_3D" # handles far, low-parallax outdoor points
  init_cov_dt: 1e-4
  init_cov_ex_o: 1e-4
  init_cov_ex_p: 1e-4
  init_cov_in_k: 1e-1
  init_cov_in_c: 1e-1
  init_cov_in_r: 1e-5
  sigma_px: 1.5       # sunlight auto-exposure jumps and heat shimmer make KLT noisier
  chi2_mult: 1        # keep tight: rejects moving shadows / vegetation

  # --- feature initialization -----------------------------------------
  fi_min_dist: 0.5    # ignore the rover body / very close ground
  fi_max_dist: 60     # 12 cm stereo baseline: depth beyond ~60 m is pure noise
  fi_max_baseline: 2000
  fi_max_cond_number: 20000 # far points are ill-conditioned but still useful for rotation
  # ==================================================================
  # ==================================================================

# topics: ZED wrapper gray images /zed_<arm>/zed_node/<eye>/gray/rect/image (mono8).
# Real AMIAD rig, ZED HD1080 (1920x1080), Kalibr camera-IMU calibrations with the Epson IMU (/imu/data):
#   cam0/cam1 front: front_cameras_imu_1080p.bag_0-camchain-imucam.yaml
# T_cam_imu = Kalibr IMU -> camera (MINS inverts it).
# timeoffset = timeshift_cam_imu (t_imu = t_cam + timeoffset); MINS uses the left camera's value for a pair.
cam0:
  timeoffset: 0.00309321033073007
  T_cam_imu:
    - [-0.0019370397818435081, -0.9999408462123821, -0.010702894606006153, 0.05600932716672996]
    - [-0.001369440508116715, 0.010705557163141977, -0.9999417561430866, 0.08084165849969406]
    - [0.9999971862508299, -0.0019222699837480595, -0.0013900965906355478, -0.24185764882788566]
    - [0.0, 0.0, 0.0, 1.0]
  distortion_coeffs: [-0.00771992, 0.00125201, -0.000773982, -0.000590973]
  distortion_model: radtan
  intrinsics: [707.873, 705.189, 953.661, 534.146]
  resolution: [1920, 1080]
  topic: /zed_front/zed_node/left/gray/rect/image
  compressed: false
  use_mask: false
  mask: "mask_sky_960x600.png" # white = no features (sky, sun, lens flare); SVGA mask: make a 1080p one before use_mask: true

cam1:
  timeoffset: 0.003276794080429554
  T_cam_imu:
    - [-0.0005148397200872012, -0.9999458604856384, -0.010392835883389295, -0.06455582524275723]
    - [-0.0011867734275474717, 0.01039344090713129, -0.9999452824804675, 0.08077680239650377]
    - [0.9999991632540972, -0.0005024776078715321, -0.0011920601324178492, -0.24158241027241284]
    - [0.0, 0.0, 0.0, 1.0]
  distortion_coeffs: [-0.0067659, 0.000623762, -0.000305543, -0.000512362]
  distortion_model: radtan
  intrinsics: [707.824, 705.231, 955.363, 534.33]
  resolution: [1920, 1080]
  topic: /zed_front/zed_node/right/gray/rect/image
  compressed: false
  use_mask: false
  mask: "mask_sky_960x600.png" # white = no features (sky, sun, lens flare); SVGA mask: make a 1080p one before use_mask: true
