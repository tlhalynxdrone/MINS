%YAML:1.0 # need to specify the file type at the top!

cam:
  enabled: true
  max_n: 1
  use_stereo: false
  # stereo_pair: [0, 1]
  do_calib_ext: false
  do_calib_int: false
  do_calib_dt: false
  # mono tuning: keep full 848x480 (downsampling to 424x240 starves a single camera of features)
  n_pts: 500
  fast: 20
  grid_x: 16
  grid_y: 10
  min_px_dist: 30
  knn: 0.65
  downsample: false
  histogram_method: "CLAHE" # NONE, HISTOGRAM, CLAHE  (CLAHE is more robust to RGB auto-exposure changes)
  max_slam: 50
  max_msckf: 60
  feat_rep: "GLOBAL_3D"
  init_cov_dt: 1e-4
  init_cov_ex_o: 1e-4
  init_cov_ex_p: 1e-4
  init_cov_in_k: 1e-1
  init_cov_in_c: 1e-1
  init_cov_in_r: 1e-5
  sigma_px: 1.5 # rolling-shutter RGB, keep slightly inflated
  chi2_mult: 1

  # mono has no stereo baseline: reject far / poorly-triangulated points that bias the filter
  fi_min_dist: 0.2
  fi_max_dist: 30
  fi_max_baseline: 200
  fi_max_cond_number: 10000
  # ==================================================================
  # ==================================================================


