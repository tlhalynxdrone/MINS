%YAML:1.0 # need to specify the file type at the top!

# SBG Pulse-80 (datasheet, Allan variance at constant temperature), inflated x10 for the filter:
#   gyro  ARW 0.012 deg/sqrt(h)  -> 3.49e-6 rad/s/sqrt(Hz)    in-run bias instability 0.05 deg/h -> 2.42e-7 rad/s
#   accel VRW 0.02 m/s/sqrt(h)   -> 3.33e-4 m/s^2/sqrt(Hz)    in-run bias instability 6 ug       -> 5.88e-5 m/s^2
# Bias instabilities are used as bias random walk densities. In Isaac Sim (run_sim.py) the
# /pulse80/imu sensor is ideal (no noise, no bias): these values only keep the filter well posed.
imu:
  accel_noise: 3.33e-03   # [ m / s^2 / sqrt(Hz) ]   ( accel "white noise" )
  accel_bias: 5.88e-04    # [ m / s^3 / sqrt(Hz) ].  ( accel bias diffusion )
  gyro_noise: 3.49e-05    # [ rad / s / sqrt(Hz) ]   ( gyro "white noise" )
  gyro_bias: 2.42e-06     # [ rad / s^2 / sqrt(Hz) ] ( gyro bias diffusion )
  topic: /pulse80/imu
